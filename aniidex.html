<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aniidex · Aniimo Guia de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20260926">
</head>
<body>
<header class="top" id="top"></header>
<main>
  <section class="hero"><div class="kicker">Enciclopédia</div><h1>Aniidex</h1>
    <p class="lead">Todos os Aniimo com elemento, papel, stats base, trait, skills principais, evolução e forma Prismana. Clique num card para abrir a ficha.</p></section>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar por nome, trait ou skill…" aria-label="Buscar">
    <select id="sort" aria-label="Ordenar">
      <option value="dex">Ordem do Aniidex</option><option value="total">Maior total</option><option value="atk">Maior ATK</option><option value="brk">Maior BREAK</option><option value="tier">Melhor tier</option>
    </select>
  </div>
  <div class="bar"><div class="tg" id="fe"></div></div>
  <div class="bar"><div class="tg" id="fr"></div><div class="tg" id="fx"><button data-x="final">Só formas finais</button><button data-x="pr">Com Prismana</button></div><span class="count" id="count"></span></div>
  <div class="grid g3" id="grid"><div class="loading">Carregando…</div></div>
</main>
<dialog id="dlg"><div class="dlg" id="dlgc"></div></dialog>
<footer id="foot"></footer>
<script src="assets/app.js?v=20260926"></script>
<script>
(async () => {
  try {
    const [dex, sis, bd] = await Promise.all([A.load("aniimo"), A.load("sistemas"), A.load("builds")]);
    A.setTypes(sis); A.nav(dex.atualizado);
    const esc = A.esc, L = dex.aniimo, amap = A.byName(L), E = sis.elementos;
    const ROLES = ["DPS","Break","Suporte","Cura","Regen"], SN = ["HP","ATK","P.DEF","REGEN","M.DEF","BREAK"];
    const ORDER = {"SS":0,"S+":0,"S":1,"A":2,"B":3,"C":4,"D":5};
    const tscore = (a) => Math.min(ORDER[a.tier.ath] ?? 9, ORDER[a.tier.mob] ?? 9);
    const st = { q:"", el:new Set(), r:new Set(), final:false, pr:false, sort:"dex" };

    document.getElementById("fe").innerHTML = E.map(e => `<button data-e="${e}">${e}</button>`).join("");
    document.getElementById("fr").innerHTML = ROLES.map(r => `<button data-r="${r}">${r}</button>`).join("");

    const bars = (s) => s ? `<div class="bars">${s.map((v,i) => `<span>${SN[i]}</span><div class="b"><i style="width:${v ? Math.min(100, v/130*100) : 0}%"></i></div><span class="v">${v ?? "—"}</span>`).join("")}</div>` : `<p class="dim" style="font-size:.82rem;margin:0">Stats detalhados não publicados.</p>`;
    const card = (a) => `<div class="card dex" data-n="${esc(a.nome)}" tabindex="0" role="button" aria-label="Abrir ficha de ${esc(a.nome)}">
      <span class="no">#${esc(a.dex)}</span><h3>${esc(a.nome)}</h3>
      <div class="meta">${A.chips(a.el)} ${A.role(a.papel)} ${a.prismana ? `<span class="pill pr">Prismana</span>` : ""} ${!a.final ? `<span class="pill">pré-evolução</span>` : ""}</div>
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="dim" style="font-size:.82rem">Total <b style="color:var(--tx)">${a.total}</b></span><span>${A.tier(a.tier.ath,"All Things How")} ${A.tier(a.tier.mob,"Mobalytics")}</span></div>
      ${bars(a.stats)}</div>`;

    const hay = (a) => [a.nome, a.trait?.nome, a.trait?.efeito, ...a.skills.map(s => s.nome), a.evo].join(" ").toLowerCase();
    const draw = () => {
      let r = L.filter(a => (!st.q || hay(a).includes(st.q)) && (!st.el.size || a.el.some(e => st.el.has(e))) && (!st.r.size || st.r.has(a.papel)) && (!st.final || a.final) && (!st.pr || a.prismana));
      const k = {atk:1, brk:5}[st.sort];
      if (st.sort === "total") r.sort((a,b) => b.total - a.total);
      else if (k !== undefined) r.sort((a,b) => ((b.stats?.[k]) ?? -1) - ((a.stats?.[k]) ?? -1));
      else if (st.sort === "tier") r.sort((a,b) => tscore(a) - tscore(b));
      document.getElementById("grid").innerHTML = r.map(card).join("") || `<p class="dim">Nenhum Aniimo com esses filtros.</p>`;
      document.getElementById("count").textContent = `${r.length} de ${L.length}`;
    };

    const dlg = document.getElementById("dlg"), dc = document.getElementById("dlgc");
    const open = (n) => {
      const a = amap[n]; if (!a) return;
      const weak = A.weakTo(a.el, E), res = A.resists(a.el, E);
      const hits = E.filter(e => a.el.some(x => A.mult(x, e) > 1));
      dc.innerHTML = `<button class="x" aria-label="Fechar">✕</button>
        <div class="dim" style="font-family:var(--fh)">#${esc(a.dex)}</div>
        <h2 style="font-size:1.8rem;margin:.1em 0 .3em">${esc(a.nome)}</h2>
        <div class="row" style="margin-bottom:14px">${A.chips(a.el)} ${A.role(a.papel)} ${a.prismana ? `<span class="pill pr">Prismana: ${esc(a.prismana)}</span>` : ""}</div>
        <div class="grid g2" style="gap:16px">
          <div><h4>Stats base · total ${a.total}</h4>${bars(a.stats)}</div>
          <div class="kv" style="align-content:start">
            <b>Tier</b><div>${A.tier(a.tier.ath,"All Things How") || "—"} <span class="dim">ATH</span> · ${A.tier(a.tier.mob,"Mobalytics") || "—"} <span class="dim">Mobalytics</span></div>
            <b>Bate forte em</b><div class="row">${A.chips(hits) || "—"}</div>
            <b>Toma 1,6× de</b><div class="row">${A.chips(weak) || "—"}</div>
            <b>Resiste a</b><div class="row">${A.chips(res) || "—"}</div>
            ${a.local ? `<b>Onde</b><div>${esc(a.local)}</div>` : ""}
          </div>
        </div>
        ${a.trait ? `<h4 style="margin-top:18px">Trait · ${esc(a.trait.nome)}</h4><p>${esc(a.trait.efeito)}</p>` : ""}
        ${bd.builds[a.nome] ? `<h4 style="margin-top:18px">Build <a href="builds.html#${encodeURIComponent(a.nome)}" style="font-size:.8rem;font-weight:500;margin-left:6px">abrir em Builds →</a></h4>${A.buildHTML(a.nome, bd.builds[a.nome], bd.resson)}` : ""}
        ${!bd.builds[a.nome] && a.skills.length ? `<h4 style="margin-top:14px">Skills principais</h4>${a.skills.map(s => `<div class="skill">${s.power != null ? `<span class="pw">${s.power}</span>` : ""}<b>${esc(s.nome)}</b><div class="muted" style="font-size:.9rem">${esc(s.efeito)}</div></div>`).join("")}` : ""}
        ${a.nota ? `<div class="note info" style="margin-top:14px">${esc(a.nota)}</div>` : ""}
        ${a.evo ? `<h4 style="margin-top:16px">Evolução</h4><p class="muted">${esc(a.evo)}</p>` : ""}`;
      dc.querySelector(".x").onclick = () => dlg.close();
      if (!dlg.open) dlg.showModal();
      history.replaceState(null, "", "#" + encodeURIComponent(n));
    };
    dlg.addEventListener("close", () => history.replaceState(null, "", location.pathname));
    dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

    document.getElementById("grid").addEventListener("click", e => { const c = e.target.closest(".dex"); if (c) open(c.dataset.n); });
    document.getElementById("grid").addEventListener("keydown", e => { if (e.key === "Enter") { const c = e.target.closest(".dex"); if (c) open(c.dataset.n); } });
    document.getElementById("q").addEventListener("input", e => { st.q = e.target.value.trim().toLowerCase(); draw(); });
    document.getElementById("sort").addEventListener("change", e => { st.sort = e.target.value; draw(); });
    const tog = (id, key, attr) => document.getElementById(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const v = b.dataset[attr]; st[key].has(v) ? st[key].delete(v) : st[key].add(v); b.classList.toggle("on"); draw(); });
    tog("fe","el","e"); tog("fr","r","r");
    document.getElementById("fx").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; st[b.dataset.x] = !st[b.dataset.x]; b.classList.toggle("on"); draw(); });

    draw();
    const h = decodeURIComponent(location.hash.slice(1)); if (h && amap[h]) open(h);
    window.addEventListener("hashchange", () => { const n = decodeURIComponent(location.hash.slice(1)); if (n && amap[n]) open(n); });
  } catch (e) { A.fail(e, "grid"); }
})();
</script>
</body>
</html>
